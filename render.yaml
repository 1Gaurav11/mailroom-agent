services:
  - type: web
    name: mailroom-agent
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mailroom-db
          property: connectionString
      - key: MODELS
        value: ""
      - key: NODE_VERSION
        value: "22"

databases:
  - name: mailroom-db
    plan: free
